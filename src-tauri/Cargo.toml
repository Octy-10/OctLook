[package]
name = "octlook"
version = "0.2.4"
authors = ["十月"]
description = "OctLook — a fast, ad-free file previewer for designers"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Octy-10/OctLook"
homepage = "https://github.com/Octy-10"
rust-version = "1.88"

[lib]
name = "octlook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
octlook-core = { path = "crates/octlook-core" }
octlook-ocr = { path = "crates/octlook-ocr" }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
lru = "0.19"
natord = "1"
trash = "5"
parking_lot = "0.12"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows = { version = "0.62", features = [
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[workspace]
members = ["crates/octlook-core", "crates/octlook-ocr", "crates/octlook-shell"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 3
