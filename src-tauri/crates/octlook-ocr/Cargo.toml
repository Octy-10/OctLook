[package]
name = "octlook-ocr"
version = "0.1.0"
description = "Offline text recognition with PP-OCRv5 (mobile) on ONNX Runtime"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Octy-10/OctLook"
rust-version = "1.88"
publish = false

[dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries"] }
thiserror = "2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
