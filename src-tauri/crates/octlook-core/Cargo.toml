[package]
name = "octlook-core"
version = "0.1.0"
description = "OctLook decoding services shared by the viewer and the Explorer thumbnail handler"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Octy-10/OctLook"
rust-version = "1.80"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "tga", "webp", "pnm", "dds", "hdr", "exr", "qoi", "rayon"] }
fast_image_resize = { version = "6", features = ["image"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
ruzstd = "0.8"
kamadak-exif = "0.6"
base64 = "0.22"
memchr = "2"
chardetng = "0.1"
encoding_rs = "0.8"
ttf-parser = "0.25"
rayon = "1"
resvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts", "raster-images"] }
lofty = { version = "0.22.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFURL", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageSource", "objc2-core-graphics"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Graphics_Imaging"] }
