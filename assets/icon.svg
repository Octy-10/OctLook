<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- OctLook: a single crescent moon on a night-dark tile. -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D1F27"/>
      <stop offset="1" stop-color="#0B0C0F"/>
    </linearGradient>
    <linearGradient id="moon" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9D5CA"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="520" cy="532" r="262" fill="#FFF"/>
      <circle cx="626" cy="436" r="218" fill="#000"/>
    </mask>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="212" fill="url(#night)"/>
  <rect x="65" y="65" width="894" height="894" rx="211" fill="none" stroke="#FFF" stroke-opacity="0.08" stroke-width="2"/>
  <rect x="230" y="240" width="600" height="600" fill="url(#moon)" mask="url(#crescent)"/>
</svg>
