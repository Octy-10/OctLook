<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- OctLook README banner: brand on the left, a stylised viewer window on the right. -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1D26"/>
      <stop offset="1" stop-color="#0A0B0E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#6E8BFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6E8BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9D5CA"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="104" cy="110" r="46" fill="#FFF"/>
      <circle cx="122" cy="93" r="38" fill="#000"/>
    </mask>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A65"/>
      <stop offset="0.5" stop-color="#C86DD7"/>
      <stop offset="1" stop-color="#5B7CFA"/>
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#15171D"/>
      <rect width="8" height="8" fill="#1B1E25"/>
      <rect x="8" y="8" width="8" height="8" fill="#1B1E25"/>
    </pattern>
    <clipPath id="canvas"><rect x="736" y="148" width="420" height="262" rx="4"/></clipPath>
  </defs>

  <rect width="1280" height="560" fill="url(#night)"/>
  <rect width="1280" height="560" fill="url(#glow)"/>

  <!-- Brand -->
  <g transform="translate(40 52)">
    <rect x="58" y="64" width="92" height="92" fill="url(#moon)" mask="url(#crescent)"/>
  </g>
  <text x="80" y="268" fill="#F4F5F8" font-size="76" font-weight="700" letter-spacing="-2">OctLook</text>
  <text x="84" y="322" fill="#B8BDCB" font-size="26" font-weight="500">专为设计师打造的极简看图软件</text>
  <text x="84" y="362" fill="#7C8294" font-size="18">PSD · AI · CDR · Sketch · RAW · HEIC · PDF  秒开</text>

  <g font-size="15" font-weight="600">
    <rect x="84" y="404" width="112" height="36" rx="6" fill="#6E8BFF"/>
    <text x="140" y="427" fill="#FFF" text-anchor="middle">Windows</text>
    <rect x="208" y="404" width="96" height="36" rx="6" fill="none" stroke="#3A3F4D"/>
    <text x="256" y="427" fill="#D5D9E3" text-anchor="middle">macOS</text>
    <rect x="316" y="404" width="132" height="36" rx="6" fill="none" stroke="#3A3F4D"/>
    <text x="382" y="427" fill="#D5D9E3" text-anchor="middle">离线 · 开源</text>
  </g>

  <!-- Viewer window -->
  <g>
    <rect x="712" y="88" width="468" height="392" rx="8" fill="#121419" stroke="#2A2E38"/>
    <rect x="712" y="88" width="468" height="44" rx="8" fill="#171A21"/>
    <rect x="712" y="124" width="468" height="8" fill="#171A21"/>
    <line x1="712" y1="132" x2="1180" y2="132" stroke="#2A2E38"/>
    <circle cx="734" cy="110" r="5" fill="#3A3F4D"/>
    <circle cx="752" cy="110" r="5" fill="#3A3F4D"/>
    <circle cx="770" cy="110" r="5" fill="#3A3F4D"/>
    <rect x="790" y="99" width="48" height="22" rx="4" fill="none" stroke="#3A3F4D"/>
    <text x="814" y="114" fill="#AEB4C2" font-size="11" text-anchor="middle">100%</text>
    <text x="850" y="115" fill="#D5D9E3" font-size="13">poster.psd</text>
    <text x="1158" y="115" fill="#7C8294" font-size="12" text-anchor="end">3 / 24</text>

    <!-- Canvas with a layered artwork -->
    <rect x="736" y="148" width="420" height="262" rx="4" fill="url(#grid)"/>
    <g clip-path="url(#canvas)">
      <rect x="800" y="168" width="292" height="222" rx="4" fill="url(#art)"/>
      <circle cx="1030" cy="230" r="38" fill="#FFF" fill-opacity="0.85"/>
      <path d="M800 350 L880 280 L940 330 L1000 270 L1092 360 V390 H800 Z" fill="#1B1D26" fill-opacity="0.55"/>
    </g>
    <!-- Annotation: rect + arrow + label -->
    <rect x="990" y="190" width="80" height="80" fill="none" stroke="#FFD166" stroke-width="3"/>
    <path d="M900 214 L978 226" stroke="#FFD166" stroke-width="3"/>
    <path d="M986 227 L972 219 L970 235 Z" fill="#FFD166"/>
    <text x="824" y="216" fill="#FFF" font-size="15" font-weight="650">主视觉</text>
    <!-- Eyedropper chip -->
    <rect x="1050" y="372" width="92" height="26" rx="4" fill="#0E0F13" fill-opacity="0.92" stroke="#2A2E38"/>
    <rect x="1058" y="379" width="12" height="12" rx="2" fill="#C86DD7"/>
    <text x="1076" y="390" fill="#D5D9E3" font-size="12" font-family="ui-monospace, Consolas, monospace">#C86DD7</text>

    <!-- HUD toolbar -->
    <rect x="826" y="424" width="240" height="40" rx="8" fill="#1C1F27" stroke="#2A2E38"/>
    <g fill="none" stroke="#AEB4C2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M852 438 a7 7 0 1 1 -2 5 M850 434 v5 h5"/>
      <path d="M882 436 v14 h14 M878 440 h14 v14"/>
      <path d="M916 452 l8 -12 l6 6 l-8 12 z"/>
      <circle cx="950" cy="444" r="7"/><path d="M950 437 v14"/>
      <path d="M972 438 h12 M972 444 h12 M972 450 h8"/>
      <path d="M1002 437 h10 l4 4 v11 h-14 z M1005 437 v5 h7"/>
    </g>
    <rect x="1028" y="430" width="30" height="28" rx="4" fill="#6E8BFF" fill-opacity="0.2"/>
    <path d="M1036 446 l4 4 l8 -9" fill="none" stroke="#AEBDFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
