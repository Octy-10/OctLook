<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- OctLook core highlights: six flat cards, 3 × 2. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14161C"/>
      <stop offset="1" stop-color="#0C0D11"/>
    </linearGradient>
    <g id="card"><rect width="384" height="212" rx="8" fill="#181B22" stroke="#272B35"/></g>
  </defs>
  <rect width="1280" height="520" fill="url(#bg)"/>

  <g fill="none" stroke="#AEBDFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 1 Design files -->
    <g transform="translate(40 40)">
      <use href="#card"/>
      <rect x="28" y="28" width="44" height="44" rx="6" fill="#6E8BFF" fill-opacity="0.16" stroke="none"/>
      <path d="M40 38 h14 l8 8 v18 h-22 z M54 38 v8 h8"/>
      <text x="28" y="116" fill="#F4F5F8" stroke="none" font-size="22" font-weight="650">设计文件秒开</text>
      <text x="28" y="150" fill="#9AA0B0" stroke="none" font-size="15">PSD / PSB 自研解析，16/32 bit、CMYK</text>
      <text x="28" y="174" fill="#9AA0B0" stroke="none" font-size="15">AI · PDF 矢量清晰；CDR · Sketch · Fig 预览</text>
    </g>
    <!-- 2 Thumbnails -->
    <g transform="translate(448 40)">
      <use href="#card"/>
      <rect x="28" y="28" width="44" height="44" rx="6" fill="#6E8BFF" fill-opacity="0.16" stroke="none"/>
      <rect x="38" y="38" width="10" height="10" rx="1.5"/><rect x="52" y="38" width="10" height="10" rx="1.5"/>
      <rect x="38" y="52" width="10" height="10" rx="1.5"/><rect x="52" y="52" width="10" height="10" rx="1.5"/>
      <text x="28" y="116" fill="#F4F5F8" stroke="none" font-size="22" font-weight="650">系统缩略图</text>
      <text x="28" y="150" fill="#9AA0B0" stroke="none" font-size="15">资源管理器直接显示 PSD、AI、SVG、CDR</text>
      <text x="28" y="174" fill="#9AA0B0" stroke="none" font-size="15">等设计文件缩略图，带格式角标</text>
    </g>
    <!-- 3 OCR -->
    <g transform="translate(856 40)">
      <use href="#card"/>
      <rect x="28" y="28" width="44" height="44" rx="6" fill="#6E8BFF" fill-opacity="0.16" stroke="none"/>
      <path d="M38 44 v-6 h6 M56 38 h6 v6 M62 56 v6 h-6 M44 62 h-6 v-6 M44 46 h12 M44 51 h12 M44 56 h8"/>
      <text x="28" y="116" fill="#F4F5F8" stroke="none" font-size="22" font-weight="650">离线文字识别</text>
      <text x="28" y="150" fill="#9AA0B0" stroke="none" font-size="15">PP-OCRv5 + ONNX Runtime，不联网</text>
      <text x="28" y="174" fill="#9AA0B0" stroke="none" font-size="15">简繁中英日、竖排与倾斜文字</text>
    </g>
    <!-- 4 Annotate -->
    <g transform="translate(40 276)">
      <use href="#card"/>
      <rect x="28" y="28" width="44" height="44" rx="6" fill="#6E8BFF" fill-opacity="0.16" stroke="none"/>
      <path d="M40 60 l16 -16 M50 44 h6 v6 M40 40 h8"/>
      <text x="28" y="116" fill="#F4F5F8" stroke="none" font-size="22" font-weight="650">标注与裁剪</text>
      <text x="28" y="150" fill="#9AA0B0" stroke="none" font-size="15">文字、箭头、矩形、画笔，可撤销重做</text>
      <text x="28" y="174" fill="#9AA0B0" stroke="none" font-size="15">按比例或精确像素裁剪</text>
    </g>
    <!-- 5 Color -->
    <g transform="translate(448 276)">
      <use href="#card"/>
      <rect x="28" y="28" width="44" height="44" rx="6" fill="#6E8BFF" fill-opacity="0.16" stroke="none"/>
      <path d="M50 38 c6 8 10 13 10 18 a10 10 0 0 1 -20 0 c0 -5 4 -10 10 -18 z"/>
      <text x="28" y="116" fill="#F4F5F8" stroke="none" font-size="22" font-weight="650">调色与取色</text>
      <text x="28" y="150" fill="#9AA0B0" stroke="none" font-size="15">GPU 实时调色，导出所见即所得</text>
      <text x="28" y="174" fill="#9AA0B0" stroke="none" font-size="15">取色复制 HEX，自动提取主色</text>
    </g>
    <!-- 6 Non-destructive -->
    <g transform="translate(856 276)">
      <use href="#card"/>
      <rect x="28" y="28" width="44" height="44" rx="6" fill="#6E8BFF" fill-opacity="0.16" stroke="none"/>
      <path d="M50 37 l12 5 v8 c0 7 -5 11 -12 13 c-7 -2 -12 -6 -12 -13 v-8 z M45 50 l4 4 l7 -7"/>
      <text x="28" y="116" fill="#F4F5F8" stroke="none" font-size="22" font-weight="650">非破坏 · 轻量</text>
      <text x="28" y="150" fill="#9AA0B0" stroke="none" font-size="15">原文件从不改写，导出为新文件</text>
      <text x="28" y="174" fill="#9AA0B0" stroke="none" font-size="15">Rust 内核，安装包约 30 MB</text>
    </g>
  </g>
</svg>
