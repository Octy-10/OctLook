<svg xmlns="http://www.w3.org/2000/svg" overflow="hidden" viewBox="0 0 1280 960" font-family="-apple-system, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- OctLook highlights: an Apple-style bento grid on black. -->
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1C1F"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8AB4FF"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC371"/>
      <stop offset="1" stop-color="#FF5F8F"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="thumbA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#FF5F8F"/></linearGradient>
    <linearGradient id="thumbB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC371"/><stop offset="1" stop-color="#FF7A59"/></linearGradient>
    <linearGradient id="thumbC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
    <clipPath id="c1"><rect x="40" y="40" width="784" height="320" rx="28"/></clipPath>
    <clipPath id="c2"><rect x="840" y="40" width="400" height="320" rx="28"/></clipPath>
    <clipPath id="c7"><rect x="648" y="672" width="592" height="248" rx="28"/></clipPath>
  </defs>

  <rect width="1280" height="960" fill="#000"/>

  <!-- 1 · Design files (wide) -->
  <g clip-path="url(#c1)">
    <rect x="40" y="40" width="784" height="320" fill="url(#card)"/>
    <circle cx="720" cy="330" r="160" fill="#7C5CFF" opacity="0.22" filter="url(#glow)"/>
  </g>
  <rect x="40.5" y="40.5" width="783" height="319" rx="27.5" fill="none" stroke="url(#edge)"/>
  <text x="80" y="98" fill="#86868B" font-size="17" font-weight="600">设计文件</text>
  <text x="80" y="140" fill="#F5F5F7" font-size="32" font-weight="700" letter-spacing="-0.5">PSD 原生解析，层层到位。</text>
  <text x="80" y="290" fill="url(#violet)" font-size="96" font-weight="800" letter-spacing="-3">16/32 bit</text>
  <text x="82" y="326" fill="#86868B" font-size="16">CMYK · Lab · 索引色 · PSB 超大文档</text>
  <g font-size="14" font-weight="600" fill="#D1D1D6" text-anchor="middle">
    <g fill="none" stroke="#FFF" stroke-opacity="0.16">
      <rect x="560" y="176" width="72" height="34" rx="17"/><rect x="644" y="176" width="60" height="34" rx="17"/><rect x="716" y="176" width="72" height="34" rx="17"/>
      <rect x="560" y="222" width="84" height="34" rx="17"/><rect x="656" y="222" width="56" height="34" rx="17"/><rect x="724" y="222" width="64" height="34" rx="17"/>
      <rect x="560" y="268" width="68" height="34" rx="17"/><rect x="640" y="268" width="72" height="34" rx="17"/><rect x="724" y="268" width="64" height="34" rx="17"/>
    </g>
    <text x="596" y="198">PSD</text><text x="674" y="198">AI</text><text x="752" y="198">CDR</text>
    <text x="602" y="244">Sketch</text><text x="684" y="244">Fig</text><text x="756" y="244">XD</text>
    <text x="594" y="290">RAW</text><text x="676" y="290">HEIC</text><text x="756" y="290">PDF</text>
  </g>

  <!-- 2 · OCR (tall) -->
  <g clip-path="url(#c2)">
    <rect x="840" y="40" width="400" height="320" fill="url(#card)"/>
    <circle cx="1180" cy="90" r="140" fill="#FF5F8F" opacity="0.2" filter="url(#glow)"/>
  </g>
  <rect x="840.5" y="40.5" width="399" height="319" rx="27.5" fill="none" stroke="url(#edge)"/>
  <text x="880" y="98" fill="#86868B" font-size="17" font-weight="600">离线文字识别</text>
  <text x="880" y="140" fill="#F5F5F7" font-size="32" font-weight="700" letter-spacing="-0.5">图中文字，一键取出。</text>
  <text x="878" y="262" fill="url(#sunset)" font-size="96" font-weight="800" letter-spacing="-3">0.4s</text>
  <text x="880" y="300" fill="#86868B" font-size="16">PP-OCRv5 · 简繁中英日 · 竖排倾斜</text>
  <text x="880" y="326" fill="#86868B" font-size="16">全程本地运行，不上传任何图片</text>

  <!-- 3 · Thumbnails -->
  <rect x="40" y="376" width="389" height="280" rx="28" fill="url(#card)"/>
  <rect x="40.5" y="376.5" width="388" height="279" rx="27.5" fill="none" stroke="url(#edge)"/>
  <text x="76" y="430" fill="#86868B" font-size="17" font-weight="600">系统缩略图 · Windows</text>
  <text x="76" y="468" fill="#F5F5F7" font-size="26" font-weight="700" letter-spacing="-0.4">文件夹里，直接看稿。</text>
  <g font-size="11" font-weight="700" fill="#FFF">
    <rect x="76" y="508" width="96" height="96" rx="12" fill="url(#thumbA)"/>
    <rect x="186" y="508" width="96" height="96" rx="12" fill="url(#thumbB)"/>
    <rect x="296" y="508" width="96" height="96" rx="12" fill="url(#thumbC)"/>
    <rect x="132" y="584" width="34" height="16" rx="4" fill="#000" fill-opacity="0.55"/><text x="149" y="596" text-anchor="middle">PSD</text>
    <rect x="248" y="584" width="28" height="16" rx="4" fill="#000" fill-opacity="0.55"/><text x="262" y="596" text-anchor="middle">AI</text>
    <rect x="352" y="584" width="34" height="16" rx="4" fill="#000" fill-opacity="0.55"/><text x="369" y="596" text-anchor="middle">CDR</text>
  </g>
  <g font-size="12" fill="#8E8E93" text-anchor="middle">
    <text x="124" y="630">poster.psd</text><text x="234" y="630">logo.ai</text><text x="344" y="630">card.cdr</text>
  </g>

  <!-- 4 · Non-destructive -->
  <rect x="445" y="376" width="390" height="280" rx="28" fill="url(#card)"/>
  <rect x="445.5" y="376.5" width="389" height="279" rx="27.5" fill="none" stroke="url(#edge)"/>
  <text x="481" y="430" fill="#86868B" font-size="17" font-weight="600">非破坏编辑</text>
  <text x="478" y="580" fill="url(#mint)" font-size="140" font-weight="800" letter-spacing="-4">0</text>
  <text x="566" y="560" fill="#F5F5F7" font-size="26" font-weight="700">次改写原文件</text>
  <text x="481" y="622" fill="#86868B" font-size="16">调色、裁剪、标注都另存为新文件</text>

  <!-- 5 · Annotate -->
  <rect x="851" y="376" width="389" height="280" rx="28" fill="url(#card)"/>
  <rect x="851.5" y="376.5" width="388" height="279" rx="27.5" fill="none" stroke="url(#edge)"/>
  <text x="887" y="430" fill="#86868B" font-size="17" font-weight="600">标注</text>
  <text x="887" y="468" fill="#F5F5F7" font-size="26" font-weight="700" letter-spacing="-0.4">圈、写、画，一气呵成。</text>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
    <rect x="1080" y="510" width="120" height="84" stroke="#FFD60A"/>
    <path d="M898 590 C930 540 960 600 990 552 S1040 520 1060 560" stroke="#FF5F8F"/>
    <path d="M992 518 L1068 534" stroke="#0A84FF"/>
  </g>
  <path d="M1076 536 L1061 526 L1058 543 Z" fill="#0A84FF" stroke="#0A84FF" stroke-width="2" stroke-linejoin="round"/>
  <text x="908" y="528" fill="#F5F5F7" font-size="20" font-weight="700">改这里</text>
  <text x="887" y="630" fill="#86868B" font-size="16">文字 · 箭头 · 矩形 · 画笔，随时撤销</text>

  <!-- 6 · Color -->
  <rect x="40" y="672" width="592" height="248" rx="28" fill="url(#card)"/>
  <rect x="40.5" y="672.5" width="591" height="247" rx="27.5" fill="none" stroke="url(#edge)"/>
  <text x="80" y="728" fill="#86868B" font-size="17" font-weight="600">调色与取色</text>
  <text x="80" y="768" fill="#F5F5F7" font-size="30" font-weight="700" letter-spacing="-0.5">所见，即所导出。</text>
  <g>
    <circle cx="104" cy="842" r="24" fill="#FF5F57"/>
    <circle cx="164" cy="842" r="24" fill="#FF9F0A"/>
    <circle cx="224" cy="842" r="24" fill="#FFD60A"/>
    <circle cx="284" cy="842" r="24" fill="#30D158"/>
    <circle cx="344" cy="842" r="24" fill="#0A84FF"/>
    <circle cx="404" cy="842" r="24" fill="#BF5AF2"/>
    <circle cx="404" cy="842" r="30" fill="none" stroke="#F5F5F7" stroke-width="2"/>
  </g>
  <rect x="460" y="826" width="132" height="32" rx="16" fill="#2C2C2E"/>
  <text x="526" y="847" fill="#F5F5F7" font-size="14" text-anchor="middle" font-family="'SF Mono', ui-monospace, Consolas, monospace">#BF5AF2</text>
  <text x="80" y="900" fill="#86868B" font-size="16">GPU 实时预览，导出逐像素一致 · 单击取色复制 HEX</text>

  <!-- 7 · Platforms -->
  <g clip-path="url(#c7)">
    <rect x="648" y="672" width="592" height="248" fill="url(#card)"/>
    <circle cx="1180" cy="900" r="170" fill="#38BDF8" opacity="0.18" filter="url(#glow)"/>
  </g>
  <rect x="648.5" y="672.5" width="591" height="247" rx="27.5" fill="none" stroke="url(#edge)"/>
  <text x="688" y="728" fill="#86868B" font-size="17" font-weight="600">原生双平台</text>
  <text x="686" y="822" fill="url(#mint)" font-size="72" font-weight="800" letter-spacing="-2">Windows</text>
  <text x="1008" y="822" fill="#F5F5F7" font-size="72" font-weight="300">+</text>
  <text x="1064" y="822" fill="url(#violet)" font-size="72" font-weight="800" letter-spacing="-2">Mac</text>
  <text x="688" y="868" fill="#86868B" font-size="16">Rust 内核 · Apple 芯片与 Intel 原生构建</text>
  <text x="688" y="894" fill="#86868B" font-size="16">安装包约 30 MB · 无广告 · 无账号</text>
</svg>
