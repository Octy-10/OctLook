# Builds OctLook for Windows (x64) and macOS (Apple silicon, Intel).
#
# - Push a tag `vX.Y.Z` matching `version` in src-tauri/tauri.conf.json:
#   tests run, installers are built and signed for the updater, and a GitHub
#   Release with `latest.json` is published, which installed copies poll.
# - Push to main, or run it by hand (Actions → Build → Run workflow): the
#   same builds, attached to the run as downloadable artifacts, no release.
#
# Repository secret: TAURI_SIGNING_PRIVATE_KEY (the updater private key).
# Without it, non-release builds still work; they just carry no update signature.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: ""
          - name: macos-arm64
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            args: --target x86_64-apple-darwin
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the app version
        if: env.RELEASE == 'true'
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version v$version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - run: npm ci

      - name: Test
        if: matrix.name != 'macos-x64' # cross-compiled: its tests cannot run on an arm64 runner
        shell: bash
        # tauri-build checks every bundled resource exists: fetch the OCR models
        # and, on Windows, build the thumbnail DLL before compiling the app.
        run: |
          npm run typecheck
          node scripts/fetch-ocr-models.mjs
          # octlook-shell is the Windows Explorer extension: elsewhere it is skipped.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo build --release -p octlook-shell --manifest-path src-tauri/Cargo.toml
            cargo test --workspace --release --manifest-path src-tauri/Cargo.toml
          else
            cargo test --workspace --exclude octlook-shell --release --manifest-path src-tauri/Cargo.toml
          fi

      # Update signatures need the private key; without it, build unsigned installers.
      - name: Signing
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            if [ "$RELEASE" = "true" ]; then echo "::error::TAURI_SIGNING_PRIVATE_KEY is required to publish a release"; exit 1; fi
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/unsigned.json"
            echo "NO_SIGNING=--config $RUNNER_TEMP/unsigned.json" >> "$GITHUB_ENV"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: ${{ matrix.args }} ${{ env.NO_SIGNING }}
          # An empty tag only builds; a version tag also publishes the release.
          tagName: ${{ env.RELEASE == 'true' && github.ref_name || '' }}
          releaseName: OctLook ${{ github.ref_name }}
          releaseBody: |
            安装包见下方 Assets；已安装的 OctLook 会自动提示更新。
            - Windows：OctLook_*_x64-setup.exe
            - macOS（Apple 芯片）：OctLook_*_aarch64.dmg；macOS（Intel）：OctLook_*_x64.dmg
            macOS 版未经 Apple 公证，首次打开请在「系统设置 → 隐私与安全性」中点「仍要打开」。
          releaseDraft: false
          prerelease: false

      - name: Upload installers
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OctLook-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error
