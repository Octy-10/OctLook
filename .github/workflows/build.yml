# Builds OctLook for Windows (x64) and macOS (Apple silicon, Intel).
#
# - Push a tag `vX.Y.Z` matching `version` in src-tauri/tauri.conf.json:
#   tests run, installers are built and signed for the updater, and a GitHub
#   Release with `latest.json` is published once all platforms are in; installed
#   copies poll it.
# - Push to main, or run it by hand (Actions → Build → Run workflow): the
#   same builds, attached to the run as downloadable artifacts, no release.
#
# Repository secret: TAURI_SIGNING_PRIVATE_KEY (the updater private key).
# Without it, non-release builds still work; they just carry no update signature.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: ""
          - name: macos-arm64
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            args: --target x86_64-apple-darwin
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the app version
        if: env.RELEASE == 'true'
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version v$version"
            exit 1
          fi

      # The release's section of CHANGELOG.md heads the release page; the app's
      # update notice shows the same list (it reads "本次更新" from the notes).
      - name: Release notes from CHANGELOG.md
        if: env.RELEASE == 'true'
        shell: bash
        run: |
          notes=$(awk -v head="## ${GITHUB_REF_NAME#v}" '{ sub(/\r$/, "") } $0 == head { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"
            exit 1
          fi
          { echo "NOTES<<__CHANGELOG__"; printf '%s\n' "$notes"; echo "__CHANGELOG__"; } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - run: npm ci

      - name: Test
        if: matrix.name != 'macos-x64' # cross-compiled: its tests cannot run on an arm64 runner
        shell: bash
        # tauri-build checks every bundled resource exists: fetch the OCR models
        # and, on Windows, build the thumbnail DLL before compiling the app.
        run: |
          npm run typecheck
          node scripts/fetch-ocr-models.mjs
          # octlook-shell is the Windows Explorer extension: elsewhere it is skipped.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo build --release -p octlook-shell --manifest-path src-tauri/Cargo.toml
            cargo test --workspace --release --manifest-path src-tauri/Cargo.toml
          else
            cargo test --workspace --exclude octlook-shell --release --manifest-path src-tauri/Cargo.toml
          fi

      # Update signatures need the private key; without it, build unsigned installers.
      - name: Signing
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            if [ "$RELEASE" = "true" ]; then echo "::error::TAURI_SIGNING_PRIVATE_KEY is required to publish a release"; exit 1; fi
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/unsigned.json"
            echo "NO_SIGNING=--config $RUNNER_TEMP/unsigned.json" >> "$GITHUB_ENV"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: ${{ matrix.args }} ${{ env.NO_SIGNING }}
          # An empty tag only builds; a version tag also publishes the release.
          tagName: ${{ env.RELEASE == 'true' && github.ref_name || '' }}
          releaseName: OctLook ${{ github.ref_name }}
          releaseBody: |
            ## ✨ 本次更新

            ${{ env.NOTES }}

            ## 📥 下载哪个文件？

            在下方 **Assets** 里，按你的电脑选**一个**文件下载即可：

            | 你的电脑 | 下载这个文件 |
            | --- | --- |
            | **Windows 10 / 11** | 以 `_x64-setup.exe` 结尾的文件 |
            | **Mac（Apple 芯片：M1 / M2 / M3 / M4…）** | 以 `_aarch64.dmg` 结尾的文件 |
            | **Mac（Intel 处理器）** | 以 `_x64.dmg` 结尾的文件 |

            > 不知道 Mac 是哪种？点屏幕左上角的苹果图标 →「关于本机」：写着「芯片 Apple M…」选 Apple 芯片，写着「处理器 Intel…」选 Intel。
            >
            > `.sig`、`.tar.gz`、`latest.json` 是自动更新用的，**不用下载**。

            ## 🪟 Windows 安装

            1. 双击下载的 `.exe`，按提示点「下一步」完成安装（需要管理员权限）。
            2. 如果弹出「Windows 已保护你的电脑」：点 **更多信息** → **仍要运行**。
            3. 安装后在开始菜单打开 OctLook；资源管理器里的 PSD、AI 等文件会直接显示缩略图（可能要重启资源管理器或电脑后生效）。
            4. 想用 OctLook 默认打开图片：在右上角 ⚙ 设置菜单点「设为默认看图软件」，在打开的系统设置里确认即可。

            ## 🍎 Mac 安装

            1. 双击下载的 `.dmg`，把 **OctLook** 图标拖进 **应用程序（Applications）** 文件夹。
            2. 第一次打开时，系统可能提示「无法验证开发者」并拦截。请打开 **系统设置 → 隐私与安全性**，在页面下方找到 OctLook，点 **仍要打开**，再输入开机密码确认。
            3. 如果提示「已损坏，无法打开」：打开「终端」，粘贴下面这行并回车，再重新打开即可：
               ```
               xattr -dr com.apple.quarantine /Applications/OctLook.app
               ```

            > 以上提示是因为 OctLook 是免费开源软件，暂未购买 Apple 和微软的签名证书，并不是病毒。源代码完全公开在本仓库。

            ## 🔄 更新

            已安装的 OctLook 启动时会自动检查新版本，弹出提示后点「更新并重启」即可；也可以在右上角 ⚙ 设置菜单里点「检查更新」。

            ## ❓ 遇到问题

            到 [Issues](https://github.com/${{ github.repository }}/issues) 反馈，附上系统版本和出问题的文件格式，我们会尽快处理。
          # A draft until every platform is in (see `publish`): installed copies
          # never see a latest.json that lacks their platform.
          releaseDraft: true
          prerelease: false

      - name: Upload installers
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OctLook-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Publishes the draft once all three builds attached their installers and
  # latest.json; a failed build leaves it a draft, so no one updates into it.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
